<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoUrSeC - Digital Statement</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial Black', Impact, sans-serif;
            overflow: hidden;
        }

        .display-container {
            text-align: center;
            width: 95%;
            max-width: 1400px;
            position: relative;
        }

        .main-text {
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 1.3;
            margin: 0;
            transition: text-shadow 0.1s ease;
        }

        .brand-footer {
            margin-top: 40px;
            font-size: 1.2rem;
            color: #444;
            letter-spacing: 8px;
            text-transform: uppercase;
            font-family: monospace;
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .main-text {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <div class="display-container">
        <div class="main-text" id="animatedText">
            EU SO GAY ASSUMIDO E AMO DAR O CU<br>
            EU ME CHAMO LUGAS GABRIEL CORDEIRO DA SILVA<br>
            E EU SO A PUTINHA DA HoUrSeC
        </div>
        <div class="brand-footer">
            HoUrSeC Digital
        </div>
    </div>

    <script>
        const textElement = document.getElementById('animatedText');
        let hue = 0;
        const speed = 3; // Velocidade da rotação do espectro de cores

        function animateColor() {
            hue = (hue + speed) % 360;
            
            // Gera uma cor vibrante usando HSL
            const primaryColor = `hsl(${hue}, 100%, 60%)`;
            const secondaryColor = `hsl(${(hue + 60) % 360}, 100%, 50%)`;
            
            textElement.style.color = primaryColor;
            
            // Cria um efeito de brilho (glow) dinâmico
            textElement.style.textShadow = `
                0 0 10px ${primaryColor},
                0 0 20px ${primaryColor},
                0 0 40px ${secondaryColor},
                0 0 80px ${secondaryColor}
            `;

            requestAnimationFrame(animateColor);
        }

        // Inicia a animação
        animateColor();
    </script>

</body>
</html>
